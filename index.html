/* Détection automatique de la langue du joueur, anglais par défaut */
const detectLang = () => {
  try {
    const raw = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    const code = raw.split('-')[0];
    if (I18N[code]) return code;
    if (code === 'zh' || raw.indexOf('zh') === 0) return 'zh';
    if (code === 'hi' || raw.indexOf('hi') === 0) return 'hi';
    if (code === 'es' || raw.indexOf('es') === 0) return 'es';
    if (code === 'fr' || raw.indexOf('fr') === 0) return 'fr';
    return 'en';
  } catch { return 'en'; }
};

  KEY: 'colorflow_v1',
  data: {
    version: 1,
    currentLevel: 1, maxLevel: 1,
    sound: true, music: true, vibrate: true,
    undoCount: UNDO_START,
    tubeAddsCount: TUBE_ADDS_START,
    lang: null
  },
  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { raw = null; }
    if (raw && typeof raw === 'object') {
      for (const k in raw) if (raw[k] !== undefined && raw[k] !== null) this.data[k] = raw[k];
    }
    if (typeof this.data.undoCount !== 'number' || this.data.undoCount < 0) this.data.undoCount = UNDO_START;
    if (typeof this.data.tubeAddsCount !== 'number' || this.data.tubeAddsCount < 0) this.data.tubeAddsCount = TUBE_ADDS_START;
    if (this.data.currentLevel < 1 || this.data.currentLevel > TOTAL_LEVELS) this.data.currentLevel = 1;
    if (this.data.maxLevel < 1) this.data.maxLevel = this.data.currentLevel;
    if (!this.data.lang || !I18N[this.data.lang]) this.data.lang = detectLang();
    this.data.version = 1;
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch {}
  },
  setLevel(lvl) {
    const n = Math.max(1, Math.min(TOTAL_LEVELS, lvl));
    this.data.currentLevel = n;
    if (n > this.data.maxLevel) this.data.maxLevel = n;
    this.save();
  },
  reset() {
    this.data.currentLevel = 1;
    this.data.maxLevel = 1;
    this.data.undoCount = UNDO_START;
    this.data.tubeAddsCount = TUBE_ADDS_START;
    this.save();
  }
};

    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;

    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = Save.data.sound ? 1 : 0;
      this.sfxGain.connect(this.master);

      this.ambientGain = this.ctx.createGain();
      this.ambientGain.gain.value = Save.data.music ? 0.42 : 0;

      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2200;
      lp.Q.value = 0.5;
      this.ambientGain.connect(lp);
      lp.connect(this.master);

      if (Save.data.music) this.startAmbient();

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {

const SplashPool = {

    p.life = 0.55; p.maxLife = 0.55; p.color = color;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.life <= 0) { this.pool.push(p); this.active.splice(i, 1); }

  },
  draw() {

const RipplePool = {

const roundRect = (x, y, w, h, r) => {
  let tl, tr, br, bl;
  if (typeof r === 'number') { tl = tr = br = bl = r; }
  else { tl = r[0]; tr = r[1]; br = r[2]; bl = r[3]; }
  ctx.beginPath();
  ctx.moveTo(x + tl, y);
  ctx.lineTo(x + w - tr, y);
  if (tr > 0) ctx.quadraticCurveTo(x + w, y, x + w, y + tr);
  ctx.lineTo(x + w, y + h - br);
  if (br > 0) ctx.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
  ctx.lineTo(x + bl, y + h);
  if (bl > 0) ctx.quadraticCurveTo(x, y + h, x, y + h - bl);
  ctx.lineTo(x, y + tl);
  if (tl > 0) ctx.quadraticCurveTo(x, y, x + tl, y);
  ctx.closePath();
};

const buildJarPath = (p, w, h) => {

  p.lineTo(-hw, top + 8);
  p.lineTo(-hw, -rBot);
  p.quadraticCurveTo(-hw, 0, 0, 0);
  p.quadraticCurveTo(hw, 0, hw, -rBot);
  p.lineTo(hw, top + 8);
  p.lineTo(hw + 4, top + 8);
  p.lineTo(hw + 4, top);
};
const traceJar = (g, w, h) => {

};

let entriesPool = [];
const buildEntries = (b) => {
  const entries = entriesPool.pop() || [];
  entries.length = 0;
  const animating = !!(b.pourOut || b.pourIn);
  if (b.pourOut) {
    const keep = b.colors.length - b.pourOut.count;
    for (let i = 0; i < keep; i++) entries.push({ color: b.colors[i], h: 1 });
    const remain = 1 - b.pourOut.progress;
    if (remain > 0.002) entries.push({ color: b.pourOut.color, h: b.pourOut.count * remain });
  } else {
    for (let i = 0; i < b.colors.length; i++) entries.push({ color: b.colors[i], h: 1 });
  }
  if (b.pourIn) {
    const grow = b.pourIn.progress;
    if (grow > 0.002) entries.push({ color: b.pourIn.color, h: b.pourIn.count * grow });
  }
  let w = 0, i = 0;
  while (i < entries.length) {
    const col = entries[i].color;
    let sum = 0, j = i;
    while (j < entries.length && entries[j].color === col) { sum += entries[j].h; j++; }
    entries[w++] = { color: col, h: sum };
    i = j;
  }
  entries.length = w;
  return { entries, animating };
};
const releaseEntries = (built) => {
  if (built && built.entries) entriesPool.push(built.entries);
};

const getLayerGradient = (colorKey, yTop, yBot) => {

  if (Object.keys(bottleGradCache).length > 600) bottleGradCache = {};
  const g = ctx.createLinearGradient(0, yTop, 0, yBot);
  g.addColorStop(0, COLORS_LIGHT[colorKey] || COLORS[colorKey]);
  g.addColorStop(0.5, COLORS[colorKey]);
  g.addColorStop(1, COLORS_DARK[colorKey] || COLORS[colorKey]);
  bottleGradCache[key] = g;
  return g;
};

const isBottleComplete = (b) => {

  if (b.colors.length !== b.capacity) return false;
  for (let i = 1; i < b.colors.length; i++) if (b.colors[i] !== b.colors[0]) return false;

    const sh = ctx.createRadialGradient(0, 8, 2, 0, 8, w * 0.80);
    sh.addColorStop(0, 'rgba(0,0,0,0.75)');
    sh.addColorStop(0.6, 'rgba(0,0,0,0.30)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.ellipse(0, 10, w * 0.80, 18, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const built = buildEntries(b);
  const entries = built.entries;
  const animating = built.animating;

  ctx.save();
  traceJar(ctx, w, h);
  ctx.clip();

  const glassBg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  glassBg.addColorStop(0, 'rgba(18,20,38,0.96)');
  glassBg.addColorStop(0.15, 'rgba(32,36,60,0.88)');
  glassBg.addColorStop(0.50, 'rgba(22,26,46,0.82)');
  glassBg.addColorStop(0.85, 'rgba(32,36,60,0.88)');
  glassBg.addColorStop(1, 'rgba(18,20,38,0.96)');
  ctx.fillStyle = glassBg;
  ctx.fillRect(-w, -h * 1.05, w * 2, h * 1.3);

  let acc = 0;
  const phase = time * 0.004 + b.id * 1.7;
  const wobble = b.touchWobble > 0 ? b.touchWobble : 0;
  let liquidTopY = 0, topColor = null, hasLiquid = false, liquidBottomY = 0;

  for (let k = 0; k < entries.length; k++) {
    const e = entries[k];
    const hgt = Math.max(e.h * layerH, 1.5);
    const yTop = -acc - hgt;
    const yBot = -acc;
    ctx.fillStyle = getLayerGradient(e.color, Math.round(yTop), Math.round(yBot));
    const fillTop = yTop;
    const fillBot = (k === 0) ? h * 0.5 : yBot;
    ctx.fillRect(-w, fillTop, w * 2, fillBot - fillTop);
    acc += hgt;
    liquidTopY = yTop;
    topColor = e.color;
    hasLiquid = true;
    liquidBottomY = fillBot;
  }

  if (hasLiquid) {
    const sheen = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
    sheen.addColorStop(0, 'rgba(255,255,255,0.28)');
    sheen.addColorStop(0.18, 'rgba(255,255,255,0.06)');
    sheen.addColorStop(0.45, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.88, 'rgba(0,0,0,0)');
    sheen.addColorStop(1, 'rgba(0,0,0,0.18)');
    ctx.fillStyle = sheen;
    ctx.fillRect(-w, liquidTopY, w * 2, liquidBottomY - liquidTopY);
  }

  if (!animating && hasLiquid && topColor && acc > 1) {
    const surfaceY = liquidTopY;
    const amp = 0.6 + (b.smoothLevel || 0) * 1.0 + wobble * 2.8;
    ctx.fillStyle = COLORS_LIGHT[topColor] || COLORS[topColor];
    ctx.beginPath();
    ctx.moveTo(-w, surfaceY + 12);
    ctx.lineTo(-w, surfaceY);
    for (let s = 0; s <= 20; s++) {
      const px = -w + (w * 2) * s / 20;
      ctx.lineTo(px, surfaceY + Math.sin(px * 0.15 + phase * 0.8) * amp);
    }
    ctx.lineTo(w, surfaceY);
    ctx.lineTo(w, surfaceY + 12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let s = 0; s <= 20; s++) {
      const px = -w + (w * 2) * s / 20;
      const wave = Math.sin(px * 0.15 + phase * 0.8) * amp;
      if (s === 0) ctx.moveTo(px, surfaceY + wave); else ctx.lineTo(px, surfaceY + wave);
    }
    ctx.stroke();
  }

  const edgeW = w * 0.14;
  const edgeL = ctx.createLinearGradient(-w / 2, 0, -w / 2 + edgeW, 0);
  edgeL.addColorStop(0, 'rgba(0,0,0,0.60)');
  edgeL.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = edgeL;
  ctx.fillRect(-w / 2, -h, edgeW, h);
  const edgeR = ctx.createLinearGradient(w / 2, 0, w / 2 - edgeW, 0);
  edgeR.addColorStop(0, 'rgba(0,0,0,0.60)');
  edgeR.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = edgeR;
  ctx.fillRect(w / 2 - edgeW, -h, edgeW, h);

  ctx.restore();

  ctx.save();
  traceJar(ctx, w, h);
  ctx.clip();
  const bodyGrad = ctx.createLinearGradient(-w * 0.35, 0, -w * 0.10, 0);
  bodyGrad.addColorStop(0, 'rgba(255,255,255,0)');
  bodyGrad.addColorStop(0.5, 'rgba(255,255,255,0.38)');
  bodyGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(-w * 0.40, -h * 0.72, w * 0.30, h * 0.68);
  const bodyGrad2 = ctx.createLinearGradient(w * 0.20, 0, w * 0.40, 0);
  bodyGrad2.addColorStop(0, 'rgba(255,255,255,0)');
  bodyGrad2.addColorStop(0.5, 'rgba(255,255,255,0.22)');
  bodyGrad2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bodyGrad2;
  ctx.fillRect(w * 0.18, -h * 0.74, w * 0.24, h * 0.70);
  ctx.restore();

  traceJar(ctx, w, h);
  ctx.strokeStyle = 'rgba(6,4,14,0.96)';
  ctx.lineWidth = 4.5;
  ctx.stroke();
  ctx.save();
  ctx.scale(0.97, 0.982);
  traceJar(ctx, w, h);
  ctx.strokeStyle = b.isReservoir ? 'rgba(0,229,255,0.85)' : 'rgba(230,240,255,0.72)';
  ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.restore();

  if (b.flash > 0) {
    ctx.save();
    traceJar(ctx, w, h);
    ctx.clip();
    ctx.fillStyle = `rgba(255,255,255,${b.flash * 0.75})`;
    ctx.fillRect(-w, -h * 1.05, w * 2, h * 1.15);
    ctx.restore();
  }

  if (b.glowT > 0 && b.colors.length > 0) {
    const t01 = clamp(b.glowT / GLOW_DURATION, 0, 1);
    const prog = 1 - t01;
    const intensity = prog < 0.6 ? 1 : Math.max(0, (1 - prog) / 0.4);
    const pulse = 0.92 + 0.08 * Math.sin(time * 0.025);
    const jarCol = b.colors[0];
    const lightCol = COLORS_LIGHT[jarCol] || COLORS[jarCol];
    const mainCol = COLORS[jarCol];

    ctx.save();
    const halo = ctx.createRadialGradient(0, -h * 0.5, w * 0.20, 0, -h * 0.5, w * 1.9);
    halo.addColorStop(0, hexToRgba(lightCol, 0.90 * intensity * pulse));
    halo.addColorStop(0.35, hexToRgba(mainCol, 0.55 * intensity * pulse));
    halo.addColorStop(0.70, hexToRgba(mainCol, 0.20 * intensity));
    halo.addColorStop(1, hexToRgba(mainCol, 0));
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, -h * 0.5, w * 1.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    traceJar(ctx, w, h);
    ctx.clip();
    ctx.fillStyle = hexToRgba(lightCol, 0.35 * intensity * pulse);
    ctx.fillRect(-w, -h * 1.05, w * 2, h * 1.15);
    ctx.restore();

    traceJar(ctx, w, h);
    ctx.strokeStyle = hexToRgba(lightCol, 0.98 * intensity);
    ctx.lineWidth = 4.5;
    ctx.stroke();

    ctx.globalCompositeOperation = 'lighter';
    traceJar(ctx, w, h);
    ctx.strokeStyle = hexToRgba(mainCol, 0.55 * intensity * pulse);
    ctx.lineWidth = 14;
    ctx.stroke();
    traceJar(ctx, w, h);
    ctx.strokeStyle = hexToRgba(lightCol, 0.45 * intensity * pulse);
    ctx.lineWidth = 7;
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';

    for (let sp = 0; sp < 6; sp++) {
      const srng = mulberry32(b.id * 31 + sp * 7);
      const sprog = (1 - t01 + srng() * 0.4 + sp * 0.17) % 1;
      const spx = (srng() - 0.5) * w * 1.4;
      const spy = -h * (0.1 + sprog * 1.1);
      const sa = Math.sin(sprog * Math.PI) * intensity * 0.9;
      ctx.fillStyle = hexToRgba(lightCol, sa);
      ctx.beginPath();
      ctx.arc(spx, spy, 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexToRgba(mainCol, sa * 0.6);
      ctx.beginPath();
      ctx.arc(spx, spy, 4.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  releaseEntries(built);
  ctx.restore();
};

let screen = 'game';
let hudButtons = [], modalButtons = [];
let settingsOpen = false, confirmOpen = false, adPending = false;
let langPopupOpen = false;
let adCountdown = AD_DURATION, adTimer = null, victoryT = 0;
let adType = null;
let toastMessage = '';
let toastTimer = 0;

const game = {
  level: null, bottles: [], selected: null,
  busy: false, finished: false, history: [],
  pour: null
};

const clearBottles = () => { game.bottles.length = 0; };

const showToast = (msg) => {
  toastMessage = msg;
  toastTimer = TOAST_DURATION;
};

const getLevelData = (lvl) => {
  const d = LEVEL_DATA[lvl - 1];
  if (Array.isArray(d)) return d.map(a => Array.isArray(a) ? a.slice() : []);
  return [[]];
};

const startGame = (levelNum) => {
  levelNum = clamp(levelNum, 1, TOTAL_LEVELS);
  const state = getLevelData(levelNum);
  game.level = { id: levelNum, bottles: state.length, capacity: CAPACITY, state };
  clearBottles();
  game.selected = null;
  game.busy = false;
  game.finished = false;
  game.history.length = 0;
  game.pour = null;
  SplashPool.reset();
  RipplePool.reset();
  ConfettiPool.reset();
  layoutBottles(game.level);
  buildHUD();
  Save.setLevel(levelNum);
  screen = 'game';
  settingsOpen = false;
  confirmOpen = false;
  langPopupOpen = false;
  adPending = false;
  adType = null;
  if (adTimer) { clearInterval(adTimer); adTimer = null; }
  modalButtons = [];
  victoryT = 0;
};

const layoutBottles = (level) => {
  const n = level.bottles;
  const rows = n <= 6 ? 1 : 2;
  const perRow = Math.ceil(n / rows);
  const spacingX = (W - 40) / perRow;
  const bw = Math.min(BASE_BW, spacingX - 12);
  const bhFull = rows === 2 ? BASE_BH_2ROW : BASE_BH_1ROW;
  const playTop = 240;
  const playH = H - playTop - AD_BANNER_HEIGHT - 20;
  const rowGap = 30;
  const totalH = rows * bhFull + (rows - 1) * rowGap;
  const startY = playTop + Math.max(0, (playH - totalH) / 2);
  let idx = 0;
  for (let r = 0; r < rows; r++) {
    const count = Math.min(perRow, n - r * perRow);
    const rowW = (count - 1) * spacingX;
    const x0 = (W - rowW) / 2;
    const baseY = startY + r * (bhFull + rowGap) + bhFull;
    for (let c = 0; c < count; c++) {
      const x = count === 1 ? W / 2 : x0 + c * spacingX;
      const colorsInit = (level.state[idx] || []).slice();
      game.bottles.push({
        id: idx, baseX: x, baseY, x, y: baseY, rot: 0,
        w: bw, h: bhFull, capacity: CAPACITY,
        colors: colorsInit,
        selected: false, selectOffset: 0,
        shake: 0, shakeOffset: 0,
        smoothLevel: 0, touchWobble: 0,
        flash: 0, wasComplete: false, glowT: 0,
        isReservoir: false,
        pourOut: null, pourIn: null
      });
      idx++;
    }
  }
};

const buildHUD = () => {
  hudButtons = [];
  const canUndo = game.history.length > 0 && !game.busy && Save.data.undoCount > 0;
  const canAddTube = Save.data.tubeAddsCount > 0 && !game.busy && !game.finished;

  hudButtons.push({ x: W - 60, y: 68, w: 72, h: 72, icon: 'gear', onClick: openSettings, pressT: 0 });

  const btnSize = 84, gap = 60;
  const startX = (W - btnSize * 2 - gap) / 2 + btnSize / 2;
  const btnY = 180;
  hudButtons.push({
    x: startX, y: btnY, w: btnSize, h: btnSize,
    icon: 'undo', disabled: !canUndo,
    badge: String(Math.max(0, Save.data.undoCount)),
    badgeType: 'undo',
    onClick: undoMove, pressT: 0
  });
  hudButtons.push({
    x: startX + btnSize + gap, y: btnY, w: btnSize, h: btnSize,
    icon: 'jarPlus', disabled: !canAddTube,
    badge: String(Math.max(0, Save.data.tubeAddsCount)),
    badgeType: 'power',
    onClick: addReservoir, pressT: 0
  });
};

const addReservoir = () => {
  if (game.busy || game.finished || game.pour) return;
  if (Save.data.tubeAddsCount <= 0) { showAdModal('reservoir'); return; }
  Save.data.tubeAddsCount--;
  Save.save();
  const curColors = game.bottles.map(b => b.colors.slice());
  curColors.push([]);
  game.level.state = curColors;
  game.level.bottles = curColors.length;
  const prevReservoirFlags = game.bottles.map(b => b.isReservoir);
  clearBottles();
  game.selected = null;
  layoutBottles(game.level);
  for (let i = 0; i < prevReservoirFlags.length && i < game.bottles.length; i++) {
    if (prevReservoirFlags[i]) {
      game.bottles[i].isReservoir = true;
      game.bottles[i].capacity = 1;
      game.bottles[i].h = BASE_BH_1ROW * RESERVOIR_HEIGHT_FACTOR;
    }
  }
  const last = game.bottles[game.bottles.length - 1];
  if (last) {
    last.isReservoir = true;
    last.capacity = 1;
    last.h = BASE_BH_1ROW * RESERVOIR_HEIGHT_FACTOR;
  }
  buildHUD();
  Audio.addTube();
  vibrate([15, 30, 15]);
  for (const b of game.bottles) b.flash = 0.35;
};

const openSettings = () => {
  if (game.busy) return;
  settingsOpen = true;
  screen = 'settings';
  confirmOpen = false;
  langPopupOpen = false;
};

const buildSettingsPanelLogic = (x, y) => {
  const panelX = 60, panelY = 300, panelW = W - 120;
  const cardX = panelX + 24, cardW = panelW - 48;
  const rowH = 92, rowY0 = panelY + 100;
  const closeX = panelX + panelW - 40, closeY = panelY + 20;

  if (langPopupOpen) {
    const dW = 480, dH = 620;
    const dx = (W - dW) / 2, dy = (H - dH) / 2;
    const btnW = 400, btnH = 76, gap = 12;
    const startY = dy + 110;
    for (let i = 0; i < LANG_ORDER.length; i++) {
      const by = startY + i * (btnH + gap);
      const bx = W / 2 - btnW / 2;
      if (x >= bx && x <= bx + btnW && y >= by && y <= by + btnH) {
        Save.data.lang = LANG_ORDER[i];
        LANG = LANG_ORDER[i];
        Save.save();
        langPopupOpen = false;
        Audio.button();
        vibrate(15);
        return true;
      }
    }
    if (x < dx || x > dx + dW || y < dy || y > dy + dH) {
      langPopupOpen = false; Audio.button();
    }
    return false;
  }

  if ((x - closeX) ** 2 + (y - closeY) ** 2 < 40 * 40) {
    settingsOpen = false; screen = 'game'; Audio.button();
    return true;
  }
  if (confirmOpen) {
    const dW = 520, dH = 240;
    const dx = (W - dW) / 2, dy = (H - dH) / 2;
    const btnW = 160, btnH = 56, gap = 20;
    const yesX = W / 2 - btnW / 2 - gap / 2 - 8;
    const noX = W / 2 + btnW / 2 + gap / 2 + 8;
    const yBtn = dy + dH - 60;
    if (x >= yesX - btnW / 2 && x <= yesX + btnW / 2 && y >= yBtn - btnH / 2 && y <= yBtn + btnH / 2) {
      Save.reset(); confirmOpen = false; Audio.button(); vibrate(20);
      startGame(1); return true;
    }
    if (x >= noX - btnW / 2 && x <= noX + btnW / 2 && y >= yBtn - btnH / 2 && y <= yBtn + btnH / 2) {
      confirmOpen = false; Audio.button(); return true;
    }
    return false;
  }

  const keys = ['sound', 'music', 'vibrate'];
  for (let i = 0; i < 3; i++) {
    const ry = rowY0 + i * rowH + rowH / 2;
    if (y >= ry - rowH / 2 && y <= ry + rowH / 2 && x >= cardX && x <= cardX + cardW) {
      Save.data[keys[i]] = !Save.data[keys[i]];
      Save.save();
      if (keys[i] === 'sound' && Audio.sfxGain) {
        Audio.sfxGain.gain.value = Save.data.sound ? 1 : 0;
      }
      if (keys[i] === 'music') {
        if (Audio.ambientGain) Audio.ambientGain.gain.value = Save.data.music ? 0.42 : 0;
        if (Save.data.music) Audio.startAmbient(); else Audio.stopAmbient();
      }
      if (keys[i] === 'vibrate') vibrate(20);
      Audio.button();
      return true;
    }
  }
  const langRy = rowY0 + 3 * rowH + rowH / 2;
  if (y >= langRy - rowH / 2 && y <= langRy + rowH / 2 && x >= cardX && x <= cardX + cardW) {
    langPopupOpen = true; Audio.button(); return true;
  }
  const resetY = rowY0 + 4 * rowH + rowH / 2;
  if (y >= resetY - rowH / 2 && y <= resetY + rowH / 2 && x >= cardX && x <= cardX + cardW) {
    confirmOpen = true; Audio.button(); return true;
  }
  return false;
};

const showAdModal = (type) => {
  adType = type;
  adPending = false;
  screen = 'ad';
  modalButtons = [
    { x: W / 2, y: 770, w: 440, h: 88, label: t('watchAd'), fontSize: 20, primary: true,
      onClick: () => startAdTimer(type) },
    { x: W / 2, y: 880, w: 440, h: 76, label: t('cancel'), fontSize: 18,
      onClick: () => { screen = 'game'; modalButtons = []; adType = null; } }
  ];
};

const startAdTimer = (type) => {
  modalButtons = [];
  adPending = true;
  adCountdown = AD_DURATION;
  adType = type;
  screen = 'game';
  if (adTimer) clearInterval(adTimer);
  adTimer = setInterval(() => {
    adCountdown--;
    if (adCountdown <= 0) {
      clearInterval(adTimer);
      adTimer = null;
      adPending = false;
      if (type === 'undo') {
        Save.data.undoCount += AD_REWARD;
      } else if (type === 'reservoir') {
        Save.data.tubeAddsCount += AD_REWARD;
      }
      Save.save();
      Audio.pickup();
      vibrate(20);
      screen = 'game';
      adType = null;
      buildHUD();
    }
  }, 1000);
};

const undoMove = () => {
  if (game.busy || game.pour) return;
  if (game.history.length === 0) {
    showToast(t('noActionToUndo'));
    Audio.toast();
    vibrate(15);
    return;
  }
  if (Save.data.undoCount <= 0) { showAdModal('undo'); return; }
  Save.data.undoCount--;
  Save.save();
  const h = game.history.pop();
  game.level.state = h.state.map(a => a.colors.slice());
  game.level.bottles = h.state.length;
  clearBottles();
  game.selected = null;
  layoutBottles(game.level);
  for (let i = 0; i < game.bottles.length; i++) {
    if (h.state[i] && h.state[i].isReservoir) {
      game.bottles[i].isReservoir = true;
      game.bottles[i].capacity = 1;
      game.bottles[i].h = BASE_BH_1ROW * RESERVOIR_HEIGHT_FACTOR;
    }
  }
  SplashPool.reset();
  RipplePool.reset();
  Audio.undo();
  vibrate(10);
  buildHUD();
};

const canPour = (src, dst) => {
  if (!src || !dst) return 0;
  if (src === dst) return 0;
  if (isBottleComplete(src)) return 0;
  if (!src.colors.length) return 0;
  if (dst.colors.length >= dst.capacity) return 0;
  const top = src.colors[src.colors.length - 1];
  let cnt = 0;
  for (let i = src.colors.length - 1; i >= 0 && src.colors[i] === top; i--) cnt++;
  return Math.min(cnt, dst.capacity - dst.colors.length);
};

const onBottleTap = (b) => {
  if (game.busy || game.finished) return;
  if (settingsOpen || adPending || screen === 'victory' || screen === 'ad') return;
  if (b.glowT > 0.1) return;
  b.touchWobble = 0.5;

  if (isBottleComplete(b) && game.selected !== b) {
    Audio.invalid(); vibrate(20); b.shake = 0.3; return;
  }

  if (!game.selected) {
    if (!b.colors.length) { Audio.invalid(); vibrate(30); b.shake = 0.3; return; }
    game.selected = b; b.selected = true; Audio.pickup(); vibrate(12); return;
  }
  if (game.selected === b) {
    b.selected = false; game.selected = null; Audio.putDown(); return;
  }

  const count = canPour(game.selected, b);
  if (count <= 0) {
    Audio.invalid(); vibrate(30); b.shake = 0.3;
    const prev = game.selected;
    prev.selected = false; game.selected = null;
    if (b.colors.length > 0 && !isBottleComplete(b)) {
      game.selected = b; b.selected = true; Audio.pickup();
    }
    return;
  }

  game.history.push({
    type: 'pour',
    state: game.bottles.map(x => ({ colors: x.colors.slice(), isReservoir: x.isReservoir }))
  });
  if (game.history.length > 200) game.history.shift();

  const src = game.selected;
  game.selected = null;
  src.selected = false;
  beginPour(src, b, count);
};

const beginPour = (src, dst, count) => {
  const dir = dst.baseX >= src.baseX ? 1 : -1;
  const angle = POUR_ANGLE * dir;
  const lx = dir * src.w / 2, ly = -src.h + 4;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const rotOffX = lx * cosA - ly * sinA;
  const rotOffY = lx * sinA + ly * cosA;
  const dstMouthX = dst.baseX;
  const dstMouthY = dst.baseY - dst.h;
  const srcMouthTargetX = dstMouthX + dir * 6;
  const srcMouthTargetY = dstMouthY - 40;
  const finalX = srcMouthTargetX - rotOffX;
  const finalY = srcMouthTargetY - rotOffY;
  const tPour = T_POUR_BASE + count * T_POUR_PER;
  game.pour = {
    src, dst, count,
    color: src.colors[src.colors.length - 1],
    phase: 'anticipate', t: 0,
    startX: src.baseX, startY: src.baseY,
    finalX, finalY, finalRot: angle,
    baseX: src.baseX, baseY: src.baseY,
    dir, streamPhase: 0, dropTimer: 0, splashDone: false,
    liftHeight: 65, tPour
  };
  game.busy = true;
  buildHUD();
  vibrate(8);
};

const getStreamEnd = (p) => {
  const dst = p.dst;
  const layerH = dst.h / dst.capacity;
  const grow = (dst.pourIn && p.count) ? dst.pourIn.progress * p.count : 0;
  const topY = dst.baseY - (dst.colors.length + grow) * layerH;
  return { x: dst.baseX, y: topY + 3 };
};

const updatePour = (dt) => {
  const p = game.pour;
  if (!p) return;
  p.t += dt;
  if (p.phase === 'anticipate') {
    const u = clamp(p.t / T_ANTICIPATE, 0, 1);
    p.src.y = p.startY + Math.sin(u * Math.PI) * 8;
    if (u >= 1) { p.phase = 'arc'; p.t = 0; }
  } else if (p.phase === 'arc') {
    const u = clamp(p.t / T_ARC, 0, 1);
    const e = easeInOutCubic(u);
    p.src.x = lerp(p.startX, p.finalX, e);
    p.src.y = lerp(p.startY, p.finalY, e) - Math.sin(u * Math.PI) * (p.liftHeight || 28);
    p.src.rot = clamp((u - 0.2) / 0.8, 0, 1) * p.finalRot;
    if (u >= 1) {
      p.phase = 'pour';
      p.t = 0;
      p.src.pourOut = { color: p.color, count: p.count, progress: 0 };
      p.dst.pourIn = { color: p.color, count: p.count, progress: 0 };
    }
  } else if (p.phase === 'pour') {
    const u = clamp(p.t / p.tPour, 0, 1);
    p.streamPhase = u;
    p.src.pourOut.progress = u;
    p.dst.pourIn.progress = u;
    const cosA = Math.cos(p.src.rot), sinA = Math.sin(p.src.rot);
    const lx = p.dir * p.src.w / 2, ly = -p.src.h + 4;
    p.streamTopX = p.src.x + (lx * cosA - ly * sinA);
    p.streamTopY = p.src.y + (lx * sinA + ly * cosA);
    const end = getStreamEnd(p);
    p.streamBotX = end.x;
    p.streamBotY = end.y;
    p.dropTimer -= dt;
    if (p.dropTimer <= 0) {
      p.dropTimer = 0.06 + Math.random() * 0.04;
      const tt = 0.5 + Math.random() * 0.5;
      const bx = lerp(p.streamTopX, p.streamBotX, tt);
      const by = lerp(p.streamTopY, p.streamBotY, tt);
      SplashPool.spawn(bx, by, (Math.random() - 0.5) * 160, -60 - Math.random() * 100, 1.4 + Math.random() * 1.6, p.color);
    }
    if (u >= 0.15 && !p.splashDone) {
      p.splashDone = true;
      RipplePool.spawn(p.streamBotX, p.streamBotY, p.color);
    }
    if (u >= 1) {
      for (let i = 0; i < p.count; i++) p.dst.colors.push(p.src.colors.pop());
      p.src.pourOut = null;
      p.dst.pourIn = null;
      p.dst.smoothLevel = 1;
      p.phase = 'return';
      p.t = 0;
    }
  } else if (p.phase === 'return') {
    const u = clamp(p.t / T_RETURN, 0, 1);
    const e = easeOutCubic(u);
    p.src.x = lerp(p.finalX, p.baseX, e);
    p.src.y = lerp(p.finalY, p.baseY, e);
    p.src.rot = p.finalRot * (1 - e) + Math.sin(u * Math.PI * 4) * 0.05 * (1 - u);
    if (u >= 1) {
      p.src.x = p.baseX;
      p.src.y = p.baseY;
      p.src.rot = 0;
      game.pour = null;
      afterPour();
    }
  }
};

const drawPourStream = (p) => {
  if (p.phase !== 'pour') return;
  const u = p.streamPhase;
  let fade;
  if (u < 0.10) fade = u / 0.10;
  else if (u > 0.90) fade = (1 - u) / 0.10;
  else fade = 1;
  fade = clamp(fade, 0, 1);
  const sx = p.streamTopX, sy = p.streamTopY;
  const ex = p.streamBotX, ey = p.streamBotY;
  const fallDist = ey - sy;
  if (fallDist < 8) return;
  const wTop = 4.2;
  const wBot = Math.min(7.5, wTop * (1 + fallDist / 700));
  ctx.save();
  ctx.lineCap = 'round';
  ctx.globalAlpha = fade * 0.30;
  ctx.strokeStyle = COLORS[p.color];
  ctx.lineWidth = wBot * 1.55;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.globalAlpha = fade * 0.98;
  ctx.lineWidth = wTop;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.globalAlpha = fade * 0.60;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = Math.max(1.4, wTop * 0.32);
  ctx.beginPath();
  ctx.moveTo(sx - wTop * 0.18, sy);
  ctx.lineTo(ex - wTop * 0.18, ey);
  ctx.stroke();
  ctx.globalAlpha = fade;
  ctx.fillStyle = COLORS[p.color];
  ctx.beginPath(); ctx.arc(sx, sy, wTop * 1.35, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
};

const afterPour = () => {
  game.busy = false;
  for (const b of game.bottles) {
    const complete = isBottleComplete(b);
    if (complete && !b.wasComplete) {
      b.flash = 1;
      b.wasComplete = true;
      b.glowT = GLOW_DURATION;
      Audio.complete();
    } else if (!complete) b.wasComplete = false;
  }
  buildHUD();
  if (checkWin()) onWin();
};

const checkWin = () => {
  let anyNonEmpty = false;
  for (const b of game.bottles) {
    if (b.isReservoir) {
      if (b.colors.length > 0) return false;
      continue;
    }
    if (b.colors.length > 0) anyNonEmpty = true;
    if (!b.colors.length) continue;
    if (b.colors.length !== b.capacity) return false;
    for (let k = 1; k < b.colors.length; k++) {
      if (b.colors[k] !== b.colors[0]) return false;
    }
  }
  return anyNonEmpty;
};

const onWin = () => {
  game.finished = true;
  game.busy = false;
  Save.setLevel(Math.min(game.level.id + 1, TOTAL_LEVELS));
  Audio.victoryFanfare();
  vibrate([40, 60, 80, 60, 100]);
  ConfettiPool.spawnBurst(60);
  screen = 'victory';
  victoryT = 0;
  modalButtons = [
    {
      x: W / 2, y: 1080, w: 460, h: 90,
      label: t('continue'), fontSize: 24, primary: true,
      onClick: () => {
        modalButtons = [];
        startGame(Math.min(game.level.id + 1, TOTAL_LEVELS));
      }
    }
  ];
};

const getTutorialMessage = () => {
  const lvl = game.level.id;
  if (lvl > 3 || game.finished) return null;
  if (lvl === 1) return game.selected ? t('tuto1d') : t('tuto1s');
  if (lvl === 2) return game.selected ? t('tuto2d') : t('tuto2s');
  return game.selected ? t('tuto3d') : t('tuto3s');
};

const drawHudButton = (b) => {
  ctx.save();
  const press = b.pressT || 0;
  ctx.translate(b.x, b.y);
  ctx.scale(1 - 0.05 * press, 1 - 0.05 * press);
  const w = b.w, h = b.h;
  const halfW = w / 2, halfH = h / 2, r = 20;
  const isDisabled = b.disabled;

  ctx.save();
  ctx.globalAlpha = isDisabled ? 0.40 : (0.80 - press * 0.25);
  ctx.fillStyle = 'rgba(5,10,30,0.85)';
  roundRect(-halfW + 3, -halfH + 8, w, h, r);
  ctx.fill();
  ctx.restore();

  const grad = ctx.createLinearGradient(0, -halfH, 0, halfH);
  if (isDisabled) {
    grad.addColorStop(0, UI.btn3dTopOff);
    grad.addColorStop(1, UI.btn3dBottomOff);
  } else if (press > 0.3) {
    grad.addColorStop(0, UI.btn3dDark);
    grad.addColorStop(1, '#0E1C34');
  } else {
    grad.addColorStop(0, UI.btn3dTop);
    grad.addColorStop(0.4, UI.btn3dMid);
    grad.addColorStop(1, UI.btn3dBottom);
  }
  ctx.fillStyle = grad;
  roundRect(-halfW, -halfH, w, h, r);
  ctx.fill();

  ctx.strokeStyle = isDisabled ? 'rgba(20,30,55,0.9)' : 'rgba(15,25,55,0.95)';
  ctx.lineWidth = 3;
  roundRect(-halfW, -halfH, w, h, r);
  ctx.stroke();

  drawIcon(b.icon, 0, press * 2, 40, isDisabled ? 'rgba(200,215,240,0.60)' : '#FFFFFF', 3.0);

  if (b.badge !== undefined) {
    const count = parseInt(b.badge, 10) || 0;
    const badgeR = 22;
    const badgeX = halfW - 4;
    const badgeY = -halfH + 4;

    let cTop, cMid, cBot, glowCol;
    if (b.badgeType === 'power') {
      if (count >= 3)      { cTop = '#B9FF6E'; cMid = '#7CFC00'; cBot = '#2E7D00'; glowCol = '#7CFC00'; }
      else if (count === 2){ cTop = '#FFE066'; cMid = '#FFC107'; cBot = '#C77800'; glowCol = '#FFC107'; }
      else if (count === 1){ cTop = '#FFB36B'; cMid = '#FF6D00'; cBot = '#B23A00'; glowCol = '#FF6D00'; }
      else                 { cTop = '#CFCFCF'; cMid = '#9E9E9E'; cBot = '#424242'; glowCol = '#9E9E9E'; }
    } else {
      if (count >= 3)      { cTop = '#7BF7FF'; cMid = '#00E5FF'; cBot = '#00838F'; glowCol = '#00E5FF'; }
      else if (count === 2){ cTop = '#7BF7FF'; cMid = '#26C6DA'; cBot = '#006064'; glowCol = '#26C6DA'; }
      else if (count === 1){ cTop = '#FFCB7A'; cMid = '#FFB74D'; cBot = '#BF5700'; glowCol = '#FFB74D'; }
      else                 { cTop = '#CFCFCF'; cMid = '#9E9E9E'; cBot = '#424242'; glowCol = '#9E9E9E'; }
    }

    ctx.save();
    ctx.shadowColor = glowCol;
    ctx.shadowBlur = 18;
    ctx.fillStyle = cMid;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.beginPath();
    ctx.arc(badgeX + 1, badgeY + 2, badgeR + 0.5, 0, Math.PI * 2);
    ctx.fill();

    const bGrad = ctx.createLinearGradient(0, badgeY - badgeR, 0, badgeY + badgeR);
    bGrad.addColorStop(0, cTop);
    bGrad.addColorStop(0.5, cMid);
    bGrad.addColorStop(1, cBot);
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.fill();

    const shine = ctx.createRadialGradient(
      badgeX - badgeR * 0.4, badgeY - badgeR * 0.55, 1,
      badgeX - badgeR * 0.4, badgeY - badgeR * 0.55, badgeR * 0.6
    );
    shine.addColorStop(0, 'rgba(255,255,255,0.50)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.font = '900 24px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(b.badge, badgeX + 1, badgeY + 3);

    ctx.lineWidth = 6;
    ctx.strokeStyle = '#000000';
    ctx.strokeText(b.badge, badgeX, badgeY + 1);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(b.badge, badgeX, badgeY + 1);
  }
  ctx.restore();
};

const renderToast = () => {
  if (toastTimer <= 0) return;

  const t01 = 1 - toastTimer / TOAST_DURATION;
  let alpha = 1;
  if (t01 < 0.12) alpha = t01 / 0.12;
  else if (t01 > 0.82) alpha = (1 - t01) / 0.18;
  alpha = clamp(alpha, 0, 1);

  const scale = t01 < 0.2 ? 0.85 + (t01 / 0.2) * 0.15 : 1;

  const panelW = 660;
  const panelH = 180;
  const panelX = (W - panelW) / 2;
  const panelY = 400;

  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.translate(W / 2, panelY + panelH / 2);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -(panelY + panelH / 2));

  ctx.save();
  ctx.globalAlpha *= 0.65;
  ctx.fillStyle = '#000';
  roundRect(panelX + 6, panelY + 20, panelW, panelH, 32);
  ctx.fill();
  ctx.restore();

  const grad = ctx.createLinearGradient(0, panelY, 0, panelY + panelH);
  grad.addColorStop(0, 'rgba(48,52,96,0.99)');
  grad.addColorStop(0.5, 'rgba(28,32,72,0.99)');
  grad.addColorStop(1, 'rgba(14,16,42,0.99)');
  ctx.fillStyle = grad;
  roundRect(panelX, panelY, panelW, panelH, 32);
  ctx.fill();

  const halo = ctx.createRadialGradient(
    panelX + panelW / 2, panelY + panelH / 2, 20,
    panelX + panelW / 2, panelY + panelH / 2, panelW / 2
  );
  halo.addColorStop(0, 'rgba(255,213,79,0.20)');
  halo.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = halo;
  roundRect(panelX, panelY, panelW, panelH, 32);
  ctx.fill();

  const borderGrad = ctx.createLinearGradient(panelX, panelY, panelX + panelW, panelY + panelH);
  borderGrad.addColorStop(0, '#00E5FF');
  borderGrad.addColorStop(0.5, '#FFD54F');
  borderGrad.addColorStop(1, '#00E5FF');
  ctx.strokeStyle = borderGrad;
  ctx.lineWidth = 3.5;
  roundRect(panelX, panelY, panelW, panelH, 32);
  ctx.stroke();

  const iconY = panelY + 48;
  ctx.save();
  ctx.shadowColor = '#FFD54F';
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.arc(W / 2, iconY, 30, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,213,79,0.15)';
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = '#FFD54F';
  ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.arc(W / 2, iconY, 30, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#FFD54F';
  ctx.font = '900 36px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('!', W / 2, iconY + 3);

  /* Taille de police adaptative pour s'adapter à toutes les langues */
  const msgY = panelY + 128;
  const maxTextW = panelW - 60;
  let fontSize = 30;
  ctx.font = '900 ' + fontSize + 'px ' + FONT;
  while (ctx.measureText(toastMessage).width > maxTextW && fontSize > 16) {
    fontSize -= 2;
    ctx.font = '900 ' + fontSize + 'px ' + FONT;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';

  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillText(toastMessage, W / 2 + 2, msgY + 4);

  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(10,10,25,0.95)';
  ctx.strokeText(toastMessage, W / 2, msgY);

  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(toastMessage, W / 2, msgY);

  ctx.restore();
};

const renderGame = (time) => {
  drawBackground(time);
  text(`${t('level')} ${game.level.id}`, W / 2, 68, { size: 42, weight: '800', color: UI.textMain });

  const tuto = getTutorialMessage();
  if (tuto) {
    const bubbleY = 285;
    ctx.font = '700 22px ' + FONT;
    const tw = Math.max(200, ctx.measureText(tuto).width + 68);
    const th = 60;
    const tx = Math.max(30, (W - tw) / 2);
    drawGlassPanel(tx, bubbleY - th / 2, tw, th, 30, { shadowStrength: 0.6 });
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tuto, tx + tw / 2, bubbleY + 2);
  }

  let srcIdx = -1;
  if (game.pour) srcIdx = game.bottles.indexOf(game.pour.src);
  for (let i = 0; i < game.bottles.length; i++) {
    if (i === srcIdx) continue;
    drawBottle(game.bottles[i], time);
  }
  if (srcIdx >= 0) drawBottle(game.bottles[srcIdx], time);

  if (game.pour) drawPourStream(game.pour);
  RipplePool.draw();
  SplashPool.draw();
  ConfettiPool.draw();

  ctx.fillStyle = '#0A0E1F';
  ctx.fillRect(0, H - AD_BANNER_HEIGHT, W, AD_BANNER_HEIGHT);
  ctx.fillStyle = 'rgba(192,202,245,0.25)';
  ctx.font = '500 14px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t('ad'), W / 2, H - AD_BANNER_HEIGHT / 2);

  if (adPending) {
    ctx.fillStyle = 'rgba(10,11,18,0.92)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2 - 40;
    text(t('ad'), cx, cy - 60, { size: 28, weight: '700', color: UI.accent });

    const ringR = 90;
    const ringW = 12;
    const prog = 1 - (adCountdown / AD_DURATION);
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,229,255,0.20)';
    ctx.lineWidth = ringW;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
    ctx.strokeStyle = UI.accent;
    ctx.lineWidth = ringW;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';

    text(String(adCountdown), cx, cy + 2, { size: 60, weight: '900', color: '#FFFFFF' });
    text('s', cx, cy + 45, { size: 18, weight: '600', color: UI.textSub });

    const msgType = adType === 'reservoir' ? 'noMoreReservoir' : 'noMoreUndo';
    text(t(msgType), cx, cy + 140, { size: 20, weight: '600', color: UI.textMain });
  }

  renderToast();
};

  ctx.fillStyle = UI.accentDim;
  ctx.beginPath(); ctx.arc(cardX + 34, langRy, 22, 0, Math.PI * 2); ctx.fill();
  drawIcon('globe', cardX + 34, langRy, 22, UI.accent, 2.2);
  ctx.textAlign = 'left';
  ctx.font = '500 18px ' + FONT;
  ctx.fillStyle = UI.textMain;
  ctx.fillText(t('language'), cardX + 74, langRy + 1);
  const ltw = 92, lth = 38;
  const ltx = cardX + cardW - ltw;
  ctx.fillStyle = UI.accentDim;
  roundRect(ltx, langRy - lth / 2, ltw, lth, lth / 2);
  ctx.fill();
  ctx.fillStyle = UI.accent;
  ctx.font = '700 16px ' + FONT;
  ctx.textAlign = 'center';
  const curCode = (LANG_LABELS[LANG] && LANG_LABELS[LANG].code) || 'EN';
  ctx.fillText(curCode, ltx + ltw / 2, langRy + 1);

  const resetRy = rowY0 + 4 * rowH + rowH / 2;
  roundRect(cardX + 20, resetRy - 28, cardW - 40, 56, 14);
  ctx.strokeStyle = UI.danger;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  drawIcon('trash', cardX + 46, resetRy, 20, UI.danger, 2.0);
  ctx.textAlign = 'left';
  ctx.font = '600 16px ' + FONT;
  ctx.fillStyle = UI.danger;
  ctx.fillText(t('resetProgress'), cardX + 76, resetRy + 1);

  if (confirmOpen) {
    ctx.fillStyle = 'rgba(10,11,18,0.85)';
    ctx.fillRect(0, 0, W, H);
    const dW = 520, dH = 240;
    const dx = (W - dW) / 2, dy = (H - dH) / 2;
    drawGlassPanel(dx, dy, dW, dH, 24);
    text(t('resetConfirm'), W / 2, dy + 76, { size: 18, weight: '500', color: UI.textMain });
    const btnW = 160, btnH = 56, gap = 20;
    const yesX = W / 2 - btnW / 2 - gap / 2 - 8;
    const noX = W / 2 + btnW / 2 + gap / 2 + 8;
    const by = dy + dH - 60;
    ctx.fillStyle = UI.accent;
    roundRect(yesX - btnW / 2, by - btnH / 2, btnW, btnH, 14);
    ctx.fill();
    text(t('yes'), yesX, by + 1, { size: 18, weight: '700', color: '#0A0A15' });
    roundRect(noX - btnW / 2, by - btnH / 2, btnW, btnH, 14);
    ctx.strokeStyle = UI.glassBorderStrong;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    text(t('no'), noX, by + 1, { size: 18, weight: '700', color: UI.textMain });
  }

  /* ═══ Popup de sélection de langue (5 langues) ═══ */
  if (langPopupOpen) {
    ctx.fillStyle = 'rgba(10,11,18,0.90)';
    ctx.fillRect(0, 0, W, H);

    const dW = 480, dH = 620;
    const dx = (W - dW) / 2, dy = (H - dH) / 2;
    drawGlassPanel(dx, dy, dW, dH, 28);

    text(t('chooseLang'), W / 2, dy + 55, { size: 24, weight: '800', color: UI.textMain });

    const btnW = 400, btnH = 76, gap = 12;
    const startY = dy + 110;
    for (let i = 0; i < LANG_ORDER.length; i++) {
      const code = LANG_ORDER[i];
      const item = LANG_LABELS[code];
      const by = startY + i * (btnH + gap);
      const bx = W / 2 - btnW / 2;
      const selected = LANG === code;

      /* Fond */
      if (selected) {
        const grad = ctx.createLinearGradient(bx, by, bx + btnW, by + btnH);
        grad.addColorStop(0, '#00E5FF');
        grad.addColorStop(1, '#00B8D4');
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
      }
      roundRect(bx, by, btnW, btnH, 18);
      ctx.fill();

      /* Bordure */
      ctx.strokeStyle = selected ? '#FFFFFF' : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = selected ? 2.5 : 1.2;
      roundRect(bx, by, btnW, btnH, 18);
      ctx.stroke();

      /* Halo cyan sur sélection */
      if (selected) {
        ctx.save();
        ctx.shadowColor = '#00E5FF';
        ctx.shadowBlur = 18;
        roundRect(bx, by, btnW, btnH, 18);
        ctx.strokeStyle = '#00E5FF';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      /* Nom complet à gauche */
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '800 24px ' + FONT;
      ctx.fillStyle = selected ? '#0A0A15' : UI.textMain;
      ctx.fillText(item.label, bx + 32, by + btnH / 2 + 1);

      /* Code à droite */
      ctx.textAlign = 'right';
      ctx.font = '900 22px ' + FONT;
      ctx.fillStyle = selected ? '#0A0A15' : UI.accent;
      ctx.fillText(item.code, bx + btnW - 32, by + btnH / 2 + 1);
    }
  }
};

const renderAdPopup = () => {
  ctx.fillStyle = 'rgba(10,11,18,0.88)';
  ctx.fillRect(0, 0, W, H);
  const panelX = 60, panelY = 420;
  const panelW = W - 120, panelH = 500;
  drawGlassPanel(panelX, panelY, panelW, panelH, 28);
  ctx.fillStyle = UI.accentDim;
  ctx.beginPath(); ctx.arc(W / 2, panelY + 90, 44, 0, Math.PI * 2); ctx.fill();
  const iconName = adType === 'reservoir' ? 'jarPlus' : 'undo';
  drawIcon(iconName, W / 2, panelY + 90, 44, UI.accent, 2.4);
  const key = adType === 'reservoir' ? 'noReservoirAvailable' : 'noMoreUndo';
  text(t(key), W / 2, panelY + 180, { size: 22, weight: '600', color: UI.textMain });
};

const handleTap = (x, y) => {
  if (adPending) return;

  if (screen === 'victory') {
    for (let i = modalButtons.length - 1; i >= 0; i--) {
      const b = modalButtons[i];
      if (x >= b.x - b.w / 2 && x <= b.x + b.w / 2 && y >= b.y - b.h / 2 && y <= b.y + b.h / 2) {
        Audio.button();
        b.onClick();
        return;
      }
    }
    return;
  }
  if (screen === 'settings') { buildSettingsPanelLogic(x, y); return; }
  if (screen === 'ad') {
    for (let i = modalButtons.length - 1; i >= 0; i--) {
      const b = modalButtons[i];
      if (x >= b.x - b.w / 2 && x <= b.x + b.w / 2 && y >= b.y - b.h / 2 && y <= b.y + b.h / 2) {
        Audio.button();
        b.onClick();
        return;
      }
    }
    return;
  }

  for (let i = hudButtons.length - 1; i >= 0; i--) {
    const b = hudButtons[i];
    if (x >= b.x - b.w / 2 && x <= b.x + b.w / 2 && y >= b.y - b.h / 2 && y <= b.y + b.h / 2) {
      b.pressT = 1;

      if (b.icon === 'undo') {
        if (game.busy || game.pour) return;
        if (game.history.length === 0) {
          showToast(t('noActionToUndo'));
          Audio.toast();
          vibrate(15);
          return;
        }
        if (Save.data.undoCount <= 0) {
          showAdModal('undo');
          return;
        }
        Audio.button();
        undoMove();
        return;
      }

      if (b.icon === 'jarPlus') {
        if (game.busy || game.finished || game.pour) return;
        if (Save.data.tubeAddsCount <= 0) {
          showToast(t('noReservoirAvailable'));
          Audio.toast();
          vibrate(15);
          setTimeout(() => {
            if (screen === 'game') showAdModal('reservoir');
          }, 900);
          return;
        }
        Audio.button();
        addReservoir();
        return;
      }

      if (b.disabled) return;
      Audio.button();
      b.onClick();
      return;
    }
  }

  if (!game.busy && !game.finished && !game.pour) {
    for (const bo of game.bottles) {
      if (x >= bo.baseX - bo.w / 2 - 8 && x <= bo.baseX + bo.w / 2 + 8 &&
          y >= bo.baseY - bo.h - 8 && y <= bo.baseY + 8) {
        onBottleTap(bo);
        return;
      }
    }
  }
};

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  Audio.init();
  Audio.resume();
  const p = toLogical(e);
  handleTap(p.x, p.y);
}, { passive: false });

const update = (dt, time) => {
  if (screen === 'victory') victoryT += dt;
  if (toastTimer > 0) toastTimer = Math.max(0, toastTimer - dt);
  for (const b of hudButtons) {
    if (b.pressT > 0) b.pressT = Math.max(0, b.pressT - dt * 4);
  }
  for (const b of game.bottles) {
    if (b.glowT > 0) b.glowT = Math.max(0, b.glowT - dt);
    const target = b.selected ? -22 : 0;
    b.selectOffset += (target - b.selectOffset) * Math.min(1, dt * 15);
    if (b.shake > 0) {
      b.shake -= dt;
      b.shakeOffset = Math.sin((0.3 - b.shake) * 60) * 8 * (b.shake / 0.3);
    } else b.shakeOffset = 0;
    if (b.smoothLevel > 0) b.smoothLevel = Math.max(0, b.smoothLevel - dt * 2.5);
    if (b.touchWobble > 0) b.touchWobble = Math.max(0, b.touchWobble - dt * 1.8);
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 2.2);
  }
  if (game.pour) updatePour(dt);
  SplashPool.update(dt);
  RipplePool.update(dt);
  ConfettiPool.update(dt);
};

const render = (time) => {
  ctx.clearRect(0, 0, W, H);
  renderGame(time);
  if (screen === 'settings') renderSettingsPanel();
  else if (screen === 'ad') renderAdPopup();
  else if (screen === 'victory') renderVictory(time);

  if (screen === 'game') {
    for (const b of hudButtons) drawHudButton(b);
  }
  if (screen === 'victory' || screen === 'ad') {
    for (const b of modalButtons) {
      const r = b.h / 2;
      if (b.primary) {
        ctx.fillStyle = UI.accent;
        roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, r);
        ctx.fill();
        if (b.label) text(b.label, b.x, b.y, { size: b.fontSize || 20, weight: '700', color: '#0A0A15' });
      } else {
        roundRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, r);
        ctx.strokeStyle = UI.glassBorderStrong;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        if (b.label) text(b.label, b.x, b.y, { size: b.fontSize || 18, weight: '600', color: UI.textMain });
      }
    }
  }
};

let lastT = 0;
const loop = (now) => {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(loop);
};

try {
  layout();
  startGame(clamp(Save.data.currentLevel || 1, 1, TOTAL_LEVELS));
  requestAnimationFrame((tt) => { lastT = tt; loop(tt); });
} catch (err) {
  console.error('Boot error:', err);
}

})();
</script>
</body>
</html>
